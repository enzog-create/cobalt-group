    <div style="font:700 clamp(14px,2.2vw,30px)/1 Montserrat,sans-serif;color:#FFFFFF;letter-spacing:.42em;padding-left:.42em;text-shadow:0 2px 16px rgba(20,10,5,.55);animation:rise 1.4s .2s cubic-bezier(.2,.7,.2,1) both">LES BASTIDES</div>
    <div style="font:800 clamp(26px,4.4vw,64px)/1 Montserrat,sans-serif;margin-top:.5vw;color:#FFFFFF;letter-spacing:.06em;text-shadow:0 1px 0 #e9dfd1,0 2px 0 #d8c9b5,0 3px 0 #c6b296,0 10px 26px rgba(20,10,5,.5);animation:rise 1.4s .45s cubic-bezier(.2,.7,.2,1) both">DE L’ÉRABLE</div>
  </div>
  <div ref=${rf.white} style="position:absolute;inset:0;background:#FBFAF7;opacity:0;pointer-events:none"></div>

  <div ref=${rf.code} aria-hidden="true" style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,1.6vw,18px);pointer-events:none;color:#2A1D16;transition:color 1.2s ease;font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;text-align:center;padding:0 16px"></div>
  <div ref=${rf.ui} style="position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:18px clamp(14px,3vw,36px);gap:12px;transition:opacity .5s">
    <div style="display:flex;align-items:center;gap:10px"><img src="assets/1d3e87e554.png" alt="Cobalt Group" style="width:40px;height:40px;border-radius:50%;background:#fff;object-fit:contain" /><span class="dsk" style="font:600 10px Montserrat,sans-serif;letter-spacing:.3em;color:#F3EBDD;text-shadow:0 1px 8px rgba(0,0,0,.6)">COBALT GROUP</span></div>

  </div>
  <div ref=${rf.load} style="position:absolute;left:0;right:0;bottom:34px;display:flex;flex-direction:column;align-items:center;gap:10px;color:#F3EBDD;transition:opacity .6s;pointer-events:none">

</div>


<div ref=${siteRef} aria-hidden=${siteHidden} style="position:absolute;inset:0;z-index:30;overflow-y:auto;overflow-x:hidden;background:#F3EBDD;opacity:${siteOp};pointer-events:${sitePe};transition:opacity .7s ease;scroll-behavior:smooth">
  ${(pq)?html`
    <div style="position:fixed;inset:0;z-index:80;background:rgba(21,14,10,.94);display:flex;flex-direction:column">
      <div style="display:flex;justify-content:space-between;align-items:center;padding:14px 18px;color:#F3EBDD"><span style="font:600 10px Montserrat,sans-serif;letter-spacing:.3em">LA PLAQUETTE · FAITES DÉFILER</span><button onClick=${closePq} aria-label="Fermer" style="width:44px;height:44px;border-radius:50%;border:1px solid rgba(243,235,221,.5);background:transparent;color:#F3EBDD;font-size:22px;cursor:pointer">×</button></div>

        <div style="margin-top:38px;border:1px solid rgba(156,70,50,.35);border-radius:18px;padding:26px 26px 22px;background:rgba(255,250,243,.55);position:relative;overflow:hidden">

          <div style="font:400 15px/1.75 Inter,sans-serif;color:#4d3e34;margin-top:14px">À Marseille, le foncier constructible se raréfie et les permis de construire pour des maisons individuelles sont devenus l’exception. Neuf bastides neuves avec jardin, dans une impasse privée du 13<sup>e</sup> : ce type de programme ne se présente presque plus en ville.</div>
          <div style="font:400 15px/1.75 Inter,sans-serif;color:#4d3e34;margin-top:10px">Le permis de construire est obtenu, les travaux démarrent au premier semestre 2027. Réserver aujourd’hui, c’est choisir sa maison et son jardin avant tout le monde.</div>
          <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:18px"><span style="display:inline-flex;align-items:center;min-height:34px;padding:0 14px;border-radius:34px;background:#9C4632;color:#F3EBDD;font:600 10px Montserrat,sans-serif;letter-spacing:.16em">TRAVAUX : 1ER SEMESTRE 2027</span><span style="display:inline-flex;align-items:center;min-height:34px;padding:0 14px;border-radius:34px;border:1px solid #9C4632;color:#9C4632;font:600 10px Montserrat,sans-serif;letter-spacing:.16em">LIVRAISON ESTIMÉE : FIN 2028</span></div>
          <div style="position:absolute;right:-18px;bottom:-14px;color:#9C4632;opacity:.12"><svg aria-hidden="true" viewBox="0 0 160 60" style="width:190px;height:72px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round"><path d="M4 40C40 34 90 30 156 14"/><path d="M30 37c-4-10 2-18 10-20-2 9-5 16-10 20zM30 37c8 6 18 6 24 0-9-3-17-3-24 0zM62 31c-3-11 4-18 12-19-3 9-6 15-12 19zM62 31c8 6 19 5 25-2-9-2-18-2-25 2zM96 25c-2-10 5-17 13-17-3 8-7 14-13 17zM96 25c9 4 19 2 24-5-9-1-17 0-24 5zM128 19c0-8 6-13 13-12-3 6-7 10-13 12z"/><circle cx="48" cy="44" r="3.2"/><circle cx="82" cy="37" r="3"/></svg></div>
        </div>

      <div data-rv="" style="flex:1;min-width:0;font:400 16px/1.8 Inter,sans-serif;color:#4d3e34;padding-top:30px">
        <p style="margin:0 0 16px">Dans le 13<sup>e</sup> arrondissement de Marseille, à l’abri de la circulation, neuf maisons neuves s’organisent autour d’une voie privée fermée par un portail. Bordées de talus boisés, elles ont chacune leur jardin privatif et une architecture d’inspiration provençale.</p>
        <p style="margin:0">Au rez-de-chaussée, une grande pièce de vie s’ouvre sur le jardin par une baie coulissante. À l’étage, les chambres et la salle de bains, au calme.</p>
        <p style="margin:16px 0 0">Chaque maison dispose de deux places de stationnement privatives ; la bastide M09, en T5, profite en plus d’un garage et d’une chambre au rez-de-chaussée. Les jardins, de 58 à 150 m², sont clos et engazonnés.</p>
